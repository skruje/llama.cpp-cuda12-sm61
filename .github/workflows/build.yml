name: Build llama.cpp for Pascal GPUs (CUDA 12 / sm61)

on:
  schedule:
    # Polls upstream every 6 hours for new releases
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggers from GitHub UI

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    steps:
      - name: Check latest upstream release
        id: check
        run: |
          # Fetch latest tag from official llama.cpp repo
          LATEST_TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r .tag_name)
          
          # Fetch latest tag from THIS builder repo
          MY_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)

          echo "Upstream: $LATEST_TAG | Local: $MY_TAG"

          # Force build if manually triggered OR if upstream release tag is newer
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ([ "$LATEST_TAG" != "$MY_TAG" ] && [ "$LATEST_TAG" != "null" ]); then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # Grants GITHUB_TOKEN permission to create releases and upload artifacts
    container:
      # Swapped to match your local CUDA 12.2 environment
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04

    steps:
      - name: Install System Prerequisites
        run: |
          apt-get update && apt-get install -y \
            git cmake build-essential curl jq tar ninja-build ccache

      - name: Checkout llama.cpp at release tag
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/llama.cpp'
          ref: ${{ needs.check-and-build.outputs.latest_tag }}
          submodules: recursive

      - name: Set up ccache cache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cuda122-sm61-${{ needs.check-and-build.outputs.latest_tag }}
          restore-keys: |
            ccache-cuda122-sm61-

      - name: Configure ccache environment
        run: |
          ccache --max-size=2G
          ccache -z

      - name: Configure CMake for CUDA 12.2 & sm_61 (Ninja + ccache)
        run: |
          rm -rf build

          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="61" \
            -DGGML_CUDA_ARCHITECTURES="61" \
            -DGGML_CUDA_FORCE_MMQ=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_NCCL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_IS_DEV=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile llama.cpp
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Print ccache Statistics
        run: |
          ccache -s

      - name: Package Binary Artifacts
        run: |
          FOLDER_NAME="llama-cuda12-sm61-${{ needs.check-and-build.outputs.latest_tag }}"
          mkdir -p "$FOLDER_NAME"

          # Package only the main operational tools
          cp build/bin/llama-cli "$FOLDER_NAME/" 2>/dev/null || true
          cp build/bin/llama-server "$FOLDER_NAME/" 2>/dev/null || true
          cp build/bin/llama-bench "$FOLDER_NAME/" 2>/dev/null || true

          # Package as top-level folder archive
          tar -czvf "${FOLDER_NAME}.tar.gz" "$FOLDER_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-and-build.outputs.latest_tag }}
          name: "llama.cpp ${{ needs.check-and-build.outputs.latest_tag }} (CUDA 12.2 / sm61)"
          body: "Automated build of llama.cpp ${{ needs.check-and-build.outputs.latest_tag }} compiled with CUDA 12.2 for Pascal architecture (Compute Capability 6.1)."
          files: llama-cuda12-sm61-${{ needs.check-and-build.outputs.latest_tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
