name: Build llama.cpp for Pascal GPUs (CUDA 12 / sm61)

on:
  schedule:
    # Polls upstream every 6 hours for new stable and b#### releases
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggers from GitHub UI
    inputs:
      tag:
        description: 'Upstream tag to (re)build, e.g. 1.0.0 or b5000. Leave empty to build whatever is new.'
        required: false
        default: ''

# Never run two polls/builds at once (avoids duplicate release creation / racing cleanup)
concurrency:
  group: build-llama-cpp
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ggml-org/llama.cpp
  # Number of b#### pre-releases to keep in this repo (stable releases are always kept)
  KEEP_PRERELEASES: 10

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_work: ${{ steps.check.outputs.has_work }}
    steps:
      - name: Determine which upstream tags need building
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          STABLE_RE='^v?[0-9]+\.[0-9]+\.[0-9]+$'
          PRE_RE='^b[0-9]+$'
          API="https://api.github.com/repos"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          release_exists() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$API/${{ github.repository }}/releases/tags/$1")
            [ "$code" = "200" ]
          }

          TAGS=()

          if [ -n "$MANUAL_TAG" ]; then
            # Explicit request: always (re)build this tag
            echo "Manual request for tag: $MANUAL_TAG"
            TAGS+=("$MANUAL_TAG")
          else
            UPSTREAM=$(curl -fsS "${AUTH[@]}" "$API/$UPSTREAM_REPO/releases?per_page=100")
            LATEST=$(curl -fsS "${AUTH[@]}" "$API/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name // empty')

            # Newest numbered release ("latest" endpoint first, then scan the list)
            STABLE=""
            if [[ "$LATEST" =~ $STABLE_RE ]]; then
              STABLE="$LATEST"
            else
              STABLE=$(echo "$UPSTREAM" | jq -r --arg re "$STABLE_RE" \
                '[.[] | select(.draft | not) | .tag_name | select(test($re))] | .[0] // empty')
            fi

            # Newest b#### release (highest build number)
            PRE=$(echo "$UPSTREAM" | jq -r --arg re "$PRE_RE" \
              '[.[] | select(.draft | not) | .tag_name | select(test($re))] | sort_by(.[1:] | tonumber) | last // empty')

            echo "Newest upstream stable: ${STABLE:-none} | newest upstream b####: ${PRE:-none}"

            for T in "$STABLE" "$PRE"; do
              [ -z "$T" ] && continue
              if release_exists "$T"; then
                echo "$T already built, skipping"
              else
                echo "$T is new, will build"
                TAGS+=("$T")
              fi
            done
          fi

          if [ ${#TAGS[@]} -eq 0 ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"tag":[]}' >> "$GITHUB_OUTPUT"
          else
            MATRIX=$(printf '%s\n' "${TAGS[@]}" | jq -R . | jq -sc '{tag: .}')
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "Matrix: $MATRIX"
          fi

  build:
    needs: check
    if: needs.check.outputs.has_work == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    permissions:
      contents: write  # Grants GITHUB_TOKEN permission to create releases and upload artifacts
    defaults:
      run:
        # Container jobs can default to sh (dash); make sure steps run under bash
        shell: bash
    container:
      # Matches the local CUDA 12.2 environment
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04

    steps:
      - name: Install System Prerequisites
        run: |
          apt-get update && apt-get install -y \
            git cmake build-essential curl jq tar ninja-build ccache libssl-dev patchelf

      - name: Checkout llama.cpp at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.tag }}
          # Full history is needed so the commit count (build number) is correct
          fetch-depth: 0
          submodules: recursive

      - name: Determine build number and commit
        id: buildinfo
        run: |
          # Inside the container the workspace is owned by a different user, which makes
          # git refuse to run ("dubious ownership") and llama.cpp then falls back to
          # "build 0, commit unknown". Mark everything as safe.
          git config --global --add safe.directory '*'

          TAG="${{ matrix.tag }}"
          COMMIT=$(git rev-parse --short HEAD)
          # POSIX-compatible: b#### tags use the number from the tag, others use the commit count
          case "$TAG" in
            b[0-9]*) NUMBER="${TAG#b}" ;;
            *)       NUMBER=$(git rev-list --count HEAD) ;;
          esac

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Build number: $NUMBER | commit: $COMMIT"

      - name: Set up ccache cache directory
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cuda122-sm61-${{ matrix.tag }}
          restore-keys: |
            ccache-cuda122-sm61-

      - name: Configure ccache environment
        run: |
          ccache --max-size=2G
          ccache -z

      - name: Configure CMake for CUDA 12.2 & sm_61 (Ninja + ccache)
        run: |
          rm -rf build

          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="61" \
            -DGGML_CUDA_ARCHITECTURES="61" \
            -DGGML_CUDA_FORCE_MMQ=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_NCCL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
            -DGGML_OPENSSL=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_IS_DEV=OFF \
            -DLLAMA_BUILD_NUMBER=${{ steps.buildinfo.outputs.number }} \
            -DLLAMA_BUILD_COMMIT=${{ steps.buildinfo.outputs.commit }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile llama.cpp
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Print ccache Statistics
        run: |
          ccache -s

      - name: Verify build info
        run: |
          # The binaries cannot run here (no libcuda.so.1 on the runner), so check the
          # generated build-info.cpp that gets compiled into them instead.
          INFO=$(find build -name build-info.cpp | head -n1)
          echo "Checking $INFO"
          cat "$INFO"
          grep -q "LLAMA_BUILD_NUMBER = ${{ steps.buildinfo.outputs.number }};" "$INFO"
          grep -q "\"${{ steps.buildinfo.outputs.commit }}\"" "$INFO"

      - name: Package Binary Artifacts
        run: |
          FOLDER_NAME="llama-cuda12-sm61-${{ matrix.tag }}"
          mkdir -p "$FOLDER_NAME/lib"

          # Package only the main operational tools
          cp build/bin/llama-cli "$FOLDER_NAME/" 2>/dev/null || true
          cp build/bin/llama-server "$FOLDER_NAME/" 2>/dev/null || true
          cp build/bin/llama-bench "$FOLDER_NAME/" 2>/dev/null || true

          # --- Bundle shared library dependencies -------------------------------
          # Everything the binaries need at runtime is copied into lib/, and the
          # binaries get an RPATH of $ORIGIN/lib so they find it.
          #
          # Deliberately NOT bundled:
          #   libcuda.so.1 / libnvidia-*  -> supplied by the host NVIDIA driver
          #   glibc, libstdc++, libgcc_s  -> supplied by the host OS
          BASELINE='^(linux-vdso|ld-linux|libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|libgcc_s\.so|libstdc\+\+\.so|libresolv\.so|libutil\.so|libanl\.so|libmvec\.so|libcuda\.so|libnvidia-)'

          deps_of() {
            ldd "$@" 2>/dev/null | awk '/=> \// {print $3}'
          }

          # Walk the dependency graph until it is closed
          mapfile -t DEPS < <(deps_of "$FOLDER_NAME"/llama-*)
          while :; do
            added=0
            for lib in "${DEPS[@]}"; do
              base=$(basename "$lib")
              [[ "$base" =~ $BASELINE ]] && continue
              [ -e "$FOLDER_NAME/lib/$base" ] && continue
              cp -L "$lib" "$FOLDER_NAME/lib/$base"
              echo "bundled $base"
              added=1
              mapfile -t -O "${#DEPS[@]}" DEPS < <(deps_of "$lib")
            done
            [ "$added" -eq 0 ] && break
          done

          # Point the binaries at the bundled libraries
          for bin in "$FOLDER_NAME"/llama-*; do
            patchelf --set-rpath '$ORIGIN/lib' "$bin"
            echo "$(basename "$bin") rpath: $(patchelf --print-rpath "$bin")"
          done

          # Bundled libraries must find each other in the same directory
          for lib in "$FOLDER_NAME"/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$lib"
          done

          # Fail if anything other than the driver is still unresolved
          MISSING=$(ldd "$FOLDER_NAME"/llama-* | awk '/not found/ {print $1}' | sort -u | grep -v '^libcuda\.so' || true)
          if [ -n "$MISSING" ]; then
            echo "Unresolved dependencies:"; echo "$MISSING"; exit 1
          fi

          du -sh "$FOLDER_NAME" "$FOLDER_NAME/lib"

          # Package as top-level folder archive
          tar -czvf "${FOLDER_NAME}.tar.gz" "$FOLDER_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "llama.cpp ${{ matrix.tag }} (CUDA 12.2 / sm61)"
          body: |
            Automated build of llama.cpp ${{ matrix.tag }} (build ${{ steps.buildinfo.outputs.number }}, commit ${{ steps.buildinfo.outputs.commit }}) compiled with CUDA 12.2 for Pascal architecture (Compute Capability 6.1).
          # b#### builds are marked as pre-releases; numbered releases are regular releases
          prerelease: ${{ startsWith(matrix.tag, 'b') }}
          make_latest: ${{ !startsWith(matrix.tag, 'b') }}
          files: llama-cuda12-sm61-${{ matrix.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    # Keep every stable release, but only the newest N b#### pre-releases
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Prune old b#### pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" | jq -s 'add' > releases.json

          # b#### releases, newest (highest number) first; skip the newest $KEEP_PRERELEASES
          jq -r --argjson keep "$KEEP_PRERELEASES" '
            [.[] | select(.tag_name | test("^b[0-9]+$"))]
            | sort_by(.tag_name[1:] | tonumber) | reverse | .[$keep:]
            | .[] | "\(.id) \(.tag_name)"' releases.json > to_delete.txt

          if [ ! -s to_delete.txt ]; then
            echo "Nothing to prune"
            exit 0
          fi

          while read -r ID TAG; do
            echo "Deleting old pre-release $TAG (release id $ID)"
            gh api -X DELETE "repos/$REPO/releases/$ID"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || true
          done < to_delete.txt
